[package]
name = "sapling-stamp-proof-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stamp proofs and transaction inspection for Sapling stamps, as WebAssembly (browser and Node)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stamper-core = { package = "sapling-stamper-core", path = "../stamper-core", default-features = false, features = ["proof"] }
wasm-bindgen = "0.2"
serde_json = "1"
hex = "0.4"
zcash_protocol = "0.10"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
